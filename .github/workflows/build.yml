name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: chip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to release 'apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk "app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --title "CHIP for Android" \
            --notes "Built from commit $GITHUB_SHA. Install: transfer the APK to your phone and open it." \
          || gh release upload apk "app/build/outputs/apk/debug/app-debug.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber